name: Sync Content to Cloudflare R2

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'data/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync Markdown Content to R2
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Sync Edited Markdown Data to R2 via Native Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ github.ref == 'refs/heads/develop' && 'codingdatafy-content-dev' || 'codingdatafy-content' }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          const beforeSha = process.env.BEFORE_SHA || "";
          const currentSha = process.env.CURRENT_SHA || "HEAD";
          const r2Bucket = process.env.R2_BUCKET;

          let baseCommit = "";
          if (beforeSha && beforeSha !== "0000000000000000000000000000000000000000") {
            try {
              execSync(`git rev-parse --verify "${beforeSha}"`);
              baseCommit = beforeSha;
            } catch (e) {}
          }

          if (!baseCommit) {
            try {
              execSync("git rev-parse --verify HEAD~1");
              baseCommit = "HEAD~1";
            } catch (e) {}
          }

          let diffOutput = "";
          if (baseCommit) {
            try {
              diffOutput = execSync(`git diff --name-status "${baseCommit}" "${currentSha}"`).toString();
            } catch (e) {
              console.warn("Git diff failed, falling back to scanning all data files.");
            }
          }

          const addedOrModified = new Set();
          const deleted = new Set();

          if (diffOutput.trim()) {
            const lines = diffOutput.trim().split("\n");
            for (const line of lines) {
              const parts = line.trim().split(/\s+/);
              if (parts.length < 2) continue;
              const status = parts[0];
              const filePath = parts[parts.length - 1];

              if (filePath.startsWith("data/") && filePath.endsWith(".md")) {
                if (status.startsWith("D")) {
                  deleted.add(filePath);
                } else {
                  addedOrModified.add(filePath);
                }
              }
            }
          } else {
            function walkDir(dir) {
              if (!fs.existsSync(dir)) return;
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  walkDir(fullPath);
                } else if (file.endsWith(".md")) {
                  addedOrModified.add(fullPath);
                }
              }
            }
            walkDir("data");
          }

          console.log(`Syncing ${addedOrModified.size} edited/added file(s) and ${deleted.size} deleted file(s) to R2 bucket [${r2Bucket}]...`);

          // 1. Upload edited and newly added files
          for (const filePath of addedOrModified) {
            if (!fs.existsSync(filePath)) continue;

            let commitDate = "";
            try {
              commitDate = execSync(`git log -1 --format="%cd" --date=format:"%Y-%m-%d" -- "${filePath}"`).toString().trim();
            } catch (e) {}

            if (!commitDate) {
              commitDate = new Date().toISOString().split("T")[0];
            }

            let content = fs.readFileSync(filePath, "utf8");
            const frontmatterRegex = /^---[\r\n]+([\s\S]*?)[\r\n]+---[\r\n]*/;
            const match = content.match(frontmatterRegex);

            if (match) {
              let yamlBlock = match[1];
              if (/^updatedAt:.*/m.test(yamlBlock)) {
                yamlBlock = yamlBlock.replace(/^updatedAt:.*/m, `updatedAt: "${commitDate}"`);
              } else {
                yamlBlock = yamlBlock.trimEnd() + `\nupdatedAt: "${commitDate}"`;
              }
              content = content.replace(frontmatterRegex, `---\n${yamlBlock}\n---\n`);
            } else {
              content = `---\nupdatedAt: "${commitDate}"\n---\n` + content;
            }
            fs.writeFileSync(filePath, content, "utf8");

            const r2Key = filePath.replace(/^data\//, "");
            console.log(`[UPLOAD] ${filePath} -> ${r2Bucket}/${r2Key}`);
            execSync(`npx wrangler r2 object put "${r2Bucket}/${r2Key}" --file="${filePath}" --remote`, { stdio: "inherit" });
          }

          // 2. Remove deleted files from R2
          for (const filePath of deleted) {
            const r2Key = filePath.replace(/^data\//, "");
            console.log(`[DELETE] ${r2Bucket}/${r2Key}`);
            try {
              execSync(`npx wrangler r2 object delete "${r2Bucket}/${r2Key}" --remote`, { stdio: "inherit" });
            } catch (e) {
              console.warn(`[DELETE SKIPPED] Could not delete ${r2Key} from R2.`);
            }
          }
          '