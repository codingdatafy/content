name: Sync Content to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync R2 Bucket
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Git Commit Timestamps into Frontmatter
        run: |
          python3 -c '
          import os, subprocess, datetime

          for root, dirs, files in os.walk("data"):
              for file in files:
                  if file.endswith(".md"):
                      filepath = os.path.join(root, file)
                      try:
                          res = subprocess.check_output(["git", "log", "-1", "--format=%cd", "--date=format:%Y-%m-%d", "--", filepath]).decode().strip()
                      except Exception:
                          res = ""
                      if not res:
                          res = datetime.datetime.utcnow().strftime("%Y-%m-%d")

                      with open(filepath, "r", encoding="utf-8") as f:
                          content = f.read()

                      if content.startswith("---"):
                          parts = content.split("---", 2)
                          if len(parts) >= 3:
                              frontmatter = parts[1]
                              lines = frontmatter.split("\n")
                              updated = False
                              for idx, line in enumerate(lines):
                                  if line.startswith("updatedAt:"):
                                      lines[idx] = f"updatedAt: \"{res}\""
                                      updated = True
                                      break
                              if not updated:
                                  lines.append(f"updatedAt: \"{res}\"")
                              parts[1] = "\n".join(lines)
                              new_content = "---".join(parts)
                          else:
                              new_content = content
                      else:
                          new_content = f"---\nupdatedAt: \"{res}\"\n---\n" + content

                      with open(filepath, "w", encoding="utf-8") as f:
                          f.write(new_content)
          '

      - name: Configure AWS Credentials for Cloudflare R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Sync Markdown Data to Cloudflare R2
        run: |
          aws s3 sync ./data s3://codingdatafy-content \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --exact-timestamps \
            --delete