name: Sync Content to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync R2 Bucket
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Markdown Files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            data/**/*.md

      - name: Inject Git Commit Timestamps into Changed Frontmatter
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          const fileList = process.env.ALL_CHANGED_FILES ? process.env.ALL_CHANGED_FILES.split(" ") : [];

          for (const filePath of fileList) {
            if (!filePath || !filePath.endsWith(".md") || !fs.existsSync(filePath)) continue;

            let commitDate = "";
            try {
              commitDate = execSync(`git log -1 --format="%cd" --date=format:"%Y-%m-%d" -- "${filePath}"`).toString().trim();
            } catch (e) {}

            if (!commitDate) {
              commitDate = new Date().toISOString().split("T")[0];
            }

            let content = fs.readFileSync(filePath, "utf8");
            const frontmatterRegex = /^---[\r\n]+([\s\S]*?)[\r\n]+---[\r\n]*/;
            const match = content.match(frontmatterRegex);

            if (match) {
              let yamlBlock = match[1];
              if (/^updatedAt:.*/m.test(yamlBlock)) {
                yamlBlock = yamlBlock.replace(/^updatedAt:.*/m, `updatedAt: "${commitDate}"`);
              } else {
                yamlBlock = yamlBlock.trimEnd() + `\nupdatedAt: "${commitDate}"`;
              }
              content = content.replace(frontmatterRegex, `---\n${yamlBlock}\n---\n`);
            } else {
              content = `---\nupdatedAt: "${commitDate}"\n---\n` + content;
            }
            fs.writeFileSync(filePath, content, "utf8");
          }
          '

      - name: Sync Changed Markdown Files to R2 via Native Wrangler
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -e
          for filePath in $ALL_CHANGED_FILES; do
            if [ -f "$filePath" ]; then
              # Convert 'data/languages/index.md' -> 'languages/index.md'
              key="${filePath#data/}"
              echo "Uploading $filePath -> codingdatafy-content/$key"
              npx wrangler r2 object put "codingdatafy-content/$key" --file="$filePath" --remote
            fi
          done