name: Sync Content to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync R2 Bucket
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Git Commit Timestamps into Frontmatter
        run: |
          for file in $(find data -name "*.md"); do
            COMMIT_DATE=$(git log -1 --format="%cd" --date=format:"%Y-%m-%d" -- "$file")
            
            if [ -z "$COMMIT_DATE" ]; then
              COMMIT_DATE=$(date -u +"%Y-%m-%d")
            fi

            if grep -q "^---" "$file"; then
              if grep -q "^updatedAt:" "$file"; then
                sed -i "s/^updatedAt:.*/updatedAt: \"$COMMIT_DATE\"/" "$file"
              else
                sed -i "s/^---/---\nupdatedAt: \"$COMMIT_DATE\"/" "$file"
              fi
            else
              echo -e "---\nupdatedAt: \"$COMMIT_DATE\"\n---\n$(cat "$file")" > "$file"
            fi
          done

      - name: Sync Markdown Data to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object sync ./data r2://codingdatafy-content-r2