name: Sync Content to Cloudflare R2

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync R2 Bucket
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Git Commit Timestamps into Frontmatter
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const { execSync } = require("child_process");

          function walkDir(dir) {
            if (!fs.existsSync(dir)) return;
            const files = fs.readdirSync(dir);
            for (const file of files) {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                walkDir(fullPath);
              } else if (file.endsWith(".md")) {
                let commitDate = "";
                try {
                  commitDate = execSync(`git log -1 --format="%cd" --date=format:"%Y-%m-%d" -- "${fullPath}"`).toString().trim();
                } catch (e) {}

                if (!commitDate) {
                  commitDate = new Date().toISOString().split("T")[0];
                }

                let content = fs.readFileSync(fullPath, "utf8");
                if (content.startsWith("---")) {
                  const parts = content.split("---");
                  if (parts.length >= 3) {
                    let frontmatter = parts[1];
                    if (/^updatedAt:.*/m.test(frontmatter)) {
                      frontmatter = frontmatter.replace(/^updatedAt:.*/m, `updatedAt: "${commitDate}"`);
                    } else {
                      frontmatter += `\nupdatedAt: "${commitDate}"`;
                    }
                    parts[1] = frontmatter;
                    content = parts.join("---");
                  }
                } else {
                  content = `---\nupdatedAt: "${commitDate}"\n---\n` + content;
                }
                fs.writeFileSync(fullPath, content, "utf8");
              }
            }
          }

          walkDir("data");
          '

      - name: Sync Markdown Data to R2 via Native Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          cd data
          find . -type f -name "*.md" | while read -r file; do
            # Clean leading './' to produce keys like 'index.md' or 'languages/index.md'
            key="${file#./}"
            echo "Uploading data/$key -> codingdatafy-content/$key"
            npx wrangler r2 object put "codingdatafy-content/$key" --file="$file" --remote
          done