name: Sync Content to Cloudflare R2

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'data/**'
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force full scan and sync of all markdown files in data/ to R2'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync R2 Bucket
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Sync Edited Markdown Data to R2 via Native Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ (github.ref_name == 'develop' || github.ref == 'refs/heads/develop') && 'codingdatafy-content-dev' || 'codingdatafy-content' }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL_SYNC: ${{ inputs.force_full_sync && 'true' || 'false' }}
        run: npm run sync